
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Gestão de Stock e Calculadora Mercado Livre" />
  <link rel="manifest" href="./manifest.json" />
  <title>L'Élite Stock & Margem</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151f32',
              950: '#0a0f18',
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out',
            scaleUp: 'scaleUp 0.3s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleUp: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para converter JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const INITIAL_PRODUCTS = [
      { id: '1', name: 'Nautica Voyage EDT', category: 'Designer', size: '100ml', cost: 69.00, suggestedSell: 149.90, type: 'classic', stock: 6 },
      { id: '2', name: 'Nautica Blue EDT', category: 'Designer', size: '100ml', cost: 80.00, suggestedSell: 159.90, type: 'classic', stock: 6 },
      { id: '3', name: 'New Brand Strong EDT', category: 'Contratipo', size: '100ml', cost: 54.00, suggestedSell: 74.90, type: 'classic', stock: 6 },
      { id: '4', name: 'Antonio B. Diavolo EDT', category: 'Designer', size: '100ml', cost: 109.00, suggestedSell: 199.90, type: 'classic', stock: 4 },
      { id: '5', name: 'Animale EDT Masc', category: 'Designer', size: '100ml', cost: 198.00, suggestedSell: 299.90, type: 'classic', stock: 3 },
      { id: '6', name: 'The Icon Supreme Fem', category: 'Designer', size: '100ml', cost: 149.00, suggestedSell: 239.90, type: 'classic', stock: 2 },
      { id: '7', name: 'Light Blue EDT Fem', category: 'Designer', size: '25ml', cost: 189.00, suggestedSell: 289.90, type: 'classic', stock: 2 },
      { id: '8', name: '212 Sexy EDP Fem', category: 'Grife', size: '60ml', cost: 349.00, suggestedSell: 499.90, type: 'premium', stock: 1 },
      { id: '9', name: '1 Million EDT Masc', category: 'Grife', size: '100ml', cost: 384.00, suggestedSell: 549.90, type: 'premium', stock: 1 },
      { id: '10', name: '212 VIP Black EDP', category: 'Grife', size: '100ml', cost: 380.00, suggestedSell: 549.90, type: 'premium', stock: 1 },
      { id: '11', name: 'Montblanc Legend EDP', category: 'Grife', size: '100ml', cost: 385.00, suggestedSell: 549.90, type: 'premium', stock: 1 },
      { id: '12', name: 'Sabah Al Ward', category: 'Árabe', size: '100ml', cost: 92.00, suggestedSell: 179.90, type: 'classic', stock: 2 },
      { id: '13', name: 'Khamrah Lattafa', category: 'Árabe', size: '100ml', cost: 150.00, suggestedSell: 279.90, type: 'classic', stock: 2 },
      { id: '14', name: 'Yara Rosa Lattafa', category: 'Árabe', size: '100ml', cost: 148.00, suggestedSell: 269.90, type: 'classic', stock: 2 },
      { id: '15', name: 'Asdaaf Ameerat Al Arab', category: 'Árabe', size: '100ml', cost: 105.00, suggestedSell: 199.90, type: 'classic', stock: 2 },
      { id: '16', name: 'Bareeq Al Dhahab', category: 'Árabe', size: '100ml', cost: 110.00, suggestedSell: 209.90, type: 'classic', stock: 1 },
    ];

    function App() {
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [sales, setSales] = useState([]);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [calcCost, setCalcCost] = useState('150.00');
      const [calcSell, setCalcSell] = useState('269.90');
      const [calcType, setCalcType] = useState('classic');
      
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProdName, setNewProdName] = useState('');
      const [newProdCategory, setNewProdCategory] = useState('Designer');
      const [newProdCost, setNewProdCost] = useState('');
      const [newProdSell, setNewProdSell] = useState('');
      const [newProdStock, setNewProdStock] = useState('1');
      const [newProdType, setNewProdType] = useState('classic');

      const [selectedSaleProduct, setSelectedSaleProduct] = useState(null);
      const [salePriceInput, setSalePriceInput] = useState('');
      const [saleQtyInput, setSaleQtyInput] = useState('1');

      const calculateFees = (cost, sell, type) => {
        const valSell = parseFloat(sell) || 0;
        const valCost = parseFloat(cost) || 0;
        if (valSell <= 0) return { commission: 0, fixedFee: 0, shipping: 0, packaging: 0, netProfit: 0, margin: 0, totalFees: 0 };

        const isOverThreshold = valSell >= 79.00;
        const commissionRate = type === 'premium' ? 0.17 : 0.12;
        const commission = valSell * commissionRate;
        const fixedFee = !isOverThreshold ? 6.75 : 0;
        const shipping = isOverThreshold ? (type === 'premium' ? 21.00 : 22.00) : 0;
        const packaging = 4.50; 
        
        const totalFees = commission + fixedFee + shipping + packaging;
        const netProfit = valSell - totalFees - valCost;
        const margin = (netProfit / valSell) * 100;

        return { commission, fixedFee, shipping, packaging, totalFees, netProfit, margin };
      };

      const totalStockCount = products.reduce((acc, p) => acc + p.stock, 0);
      const totalInvested = products.reduce((acc, p) => acc + (p.cost * p.stock), 0);
      const potentialRevenue = products.reduce((acc, p) => acc + (p.suggestedSell * p.stock), 0);
      const potentialProfit = products.reduce((acc, p) => {
        const calc = calculateFees(p.cost, p.suggestedSell, p.type);
        return acc + (calc.netProfit * p.stock);
      }, 0);

      const actualRevenue = sales.reduce((acc, s) => acc + (s.sellPrice * s.qty), 0);
      const actualProfit = sales.reduce((acc, s) => acc + (s.netProfit * s.qty), 0);
      const salesCount = sales.reduce((acc, s) => acc + s.qty, 0);

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProdName || !newProdCost || !newProdSell) return;

        const newProduct = {
          id: Date.now().toString(),
          name: newProdName,
          category: newProdCategory,
          size: '100ml',
          cost: parseFloat(newProdCost),
          suggestedSell: parseFloat(newProdSell),
          type: newProdType,
          stock: parseInt(newProdStock)
        };

        setProducts([newProduct, ...products]);
        setShowAddModal(false);
        setNewProdName('');
        setNewProdCost('');
        setNewProdSell('');
        setNewProdStock('1');
      };

      const openSaleModal = (product) => {
        setSelectedSaleProduct(product);
        setSalePriceInput(product.suggestedSell.toString());
        setSaleQtyInput('1');
      };

      const handleConfirmSale = () => {
        if (!selectedSaleProduct) return;
        const qtyToSell = parseInt(saleQtyInput) || 1;
        
        if (selectedSaleProduct.stock < qtyToSell) {
          alert("Quantidade selecionada excede o stock disponível!");
          return;
        }

        const sellPrice = parseFloat(salePriceInput);
        const fees = calculateFees(selectedSaleProduct.cost, sellPrice, selectedSaleProduct.type);

        const newSale = {
          id: Date.now().toString(),
          name: selectedSaleProduct.name,
          cost: selectedSaleProduct.cost,
          sellPrice: sellPrice,
          qty: qtyToSell,
          netProfit: fees.netProfit,
          date: new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })
        };

        setProducts(products.map(p => {
          if (p.id === selectedSaleProduct.id) {
            return { ...p, stock: p.stock - qtyToSell };
          }
          return p;
        }));

        setSales([newSale, ...sales]);
        setSelectedSaleProduct(null);
      };

      const dynamicCalc = calculateFees(calcCost, calcSell, calcType);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased pb-20 md:pb-0">
          <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center">
                  <div className="flex-shrink-0 flex items-center gap-2">
                    <svg className="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                    </svg>
                    <span className="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">
                      L'ÉLITE STOCK
                    </span>
                  </div>
                  
                  <div className="hidden md:block ml-10">
                    <div className="flex space-x-4">
                      <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}>Painel Geral</button>
                      <button onClick={() => setActiveTab('stock')} className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'stock' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}>Gestão de Stock ({totalStockCount})</button>
                      <button onClick={() => setActiveTab('calculator')} className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'calculator' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}>Simulador Mercado Livre</button>
                      <button onClick={() => setActiveTab('history')} className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'history' ? 'bg-amber-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}>Vendas ({salesCount})</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            {}
            {activeTab === 'dashboard' && (
              <div className="space-y-8 animate-fadeIn">
                <div className="bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-500/30 rounded-2xl p-6 shadow-xl">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-xl font-bold text-emerald-400 flex items-center gap-2">
                        <span className="relative flex h-3 w-3">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        Objetivo: Ativação de Conta (10 Vendas)
                      </h3>
                      <p className="text-slate-300 text-sm mt-1">Complete as primeiras 10 vendas para ativar a sua reputação verde e impulsionar a visibilidade.</p>
                    </div>
                    <div className="text-right">
                      <span className="text-sm text-slate-400">Progresso</span>
                      <div className="text-2xl font-black text-emerald-300">{salesCount} / 10</div>
                    </div>
                  </div>
                  
                  <div className="mt-4 bg-slate-800 rounded-full h-4 overflow-hidden p-0.5 border border-slate-700">
                    <div className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style={{ width: `${Math.min((salesCount / 10) * 100, 100)}%` }} />
                  </div>
                  <div className="flex justify-between text-xs text-slate-400 mt-2">
                    <span>Contador Inicial</span>
                    <span>{salesCount >= 10 ? "✨ Reputação Ativa!" : `${10 - salesCount} restantes`}</span>
                  </div>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 uppercase font-semibold">Capital Investido</p>
                    <p className="text-xl md:text-2xl font-bold text-slate-100 mt-1">R$ {totalInvested.toLocaleString('pt-PT', { minimumFractionDigits: 2 })}</p>
                    <p className="text-xs text-slate-500 mt-1">Em {totalStockCount} perfumes</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 uppercase font-semibold">Faturação Prevista</p>
                    <p className="text-xl md:text-2xl font-bold text-amber-400 mt-1">R$ {potentialRevenue.toLocaleString('pt-PT', { minimumFractionDigits: 2 })}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 uppercase font-semibold">Lucro Líquido Previsto</p>
                    <p className="text-xl md:text-2xl font-bold text-emerald-400 mt-1">R$ {potentialProfit.toLocaleString('pt-PT', { minimumFractionDigits: 2 })}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs text-slate-400 uppercase font-semibold">Lucro Caixa Realizado</p>
                    <p className="text-xl md:text-2xl font-bold text-blue-400 mt-1">R$ {actualProfit.toLocaleString('pt-PT', { minimumFractionDigits: 2 })}</p>
                    <p className="text-xs text-slate-500 mt-1">Faturado: R$ {actualRevenue.toLocaleString('pt-PT', { minimumFractionDigits: 2 })}</p>
                  </div>
                </div>
              </div>
            )}

            {}
            {activeTab === 'stock' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                  <div>
                    <h3 className="text-2xl font-bold text-slate-100">Controle de Inventário</h3>
                  </div>
                  <button onClick={() => setShowAddModal(true)} className="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition">
                    Adicionar Novo Perfume
                  </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-950/80 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                          <th className="px-6 py-4">Nome do Perfume</th>
                          <th className="px-6 py-4 text-right">Custo</th>
                          <th className="px-6 py-4 text-right">Venda</th>
                          <th className="px-6 py-4 text-center">Disp.</th>
                          <th className="px-6 py-4 text-right">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {products.map((product) => (
                          <tr key={product.id} className="hover:bg-slate-850 transition">
                            <td className="px-6 py-4">
                              <div className="font-semibold text-slate-100">{product.name}</div>
                              <div className="text-xs text-slate-500">{product.category} • {product.size}</div>
                            </td>
                            <td className="px-6 py-4 text-right font-mono text-slate-300">R$ {product.cost.toFixed(2)}</td>
                            <td className="px-6 py-4 text-right font-mono font-semibold text-amber-400">R$ {product.suggestedSell.toFixed(2)}</td>
                            <td className="px-6 py-4 text-center font-bold">{product.stock} un</td>
                            <td className="px-6 py-4 text-right">
                              <button disabled={product.stock === 0} onClick={() => openSaleModal(product)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${product.stock === 0 ? 'bg-slate-800 text-slate-600' : 'bg-emerald-500 text-slate-950 hover:bg-emerald-600'}`}>
                                Vender
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {}
            {activeTab === 'calculator' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-fadeIn">
                <div className="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
                  <h3 className="text-xl font-bold text-slate-100">Simulador</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-400 mb-1.5">Preço de Custo (Pago)</label>
                      <input type="number" value={calcCost} onChange={(e) => setCalcCost(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-slate-100 font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-400 mb-1.5">Preço de Venda</label>
                      <input type="number" value={calcSell} onChange={(e) => setCalcSell(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-slate-100 font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-400 mb-2">Canal / Tipo</label>
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => setCalcType('classic')} className={`py-2 rounded-xl text-xs font-semibold border ${calcType === 'classic' ? 'bg-amber-500/10 border-amber-500 text-amber-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>Clássico</button>
                        <button onClick={() => setCalcType('premium')} className={`py-2 rounded-xl text-xs font-semibold border ${calcType === 'premium' ? 'bg-amber-500/10 border-amber-500 text-amber-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>Premium</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-2 space-y-6">
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl grid md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <div className="flex justify-between text-sm text-slate-300 pb-2 border-b border-slate-800"><span>Preço</span><span className="font-mono">R$ {parseFloat(calcSell || 0).toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-slate-400"><span>Comissão ML</span><span className="font-mono text-red-400">- R$ {dynamicCalc.commission.toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-slate-400"><span>Taxa Fixa</span><span className="font-mono text-red-400">- R$ {dynamicCalc.fixedFee.toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-slate-400"><span>Frete</span><span className="font-mono text-red-400">- R$ {dynamicCalc.shipping.toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-slate-400"><span>Embalagem</span><span className="font-mono text-red-400">- R$ {dynamicCalc.packaging.toFixed(2)}</span></div>
                    </div>
                    <div className="flex flex-col justify-center items-center bg-slate-950 p-6 rounded-2xl border border-slate-850">
                      <p className="text-xs uppercase font-bold text-slate-500">Lucro Líquido</p>
                      <p className={`text-3xl md:text-4xl font-black mt-2 ${dynamicCalc.netProfit >= 0 ? 'text-emerald-400' : 'text-red-500'}`}>
                        R$ {dynamicCalc.netProfit.toFixed(2)}
                      </p>
                      <div className="mt-4 w-full text-center text-sm font-bold text-slate-400">Margem: {dynamicCalc.margin.toFixed(1)}%</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {}
            {activeTab === 'history' && (
              <div className="space-y-6 animate-fadeIn">
                <h3 className="text-2xl font-bold text-slate-100">Registo de Vendas Realizadas</h3>
                {sales.length === 0 ? (
                  <div className="bg-slate-900 border border-slate-800 p-12 text-center rounded-2xl">
                    <h4 className="text-lg font-bold text-slate-300">Nenhuma venda simulada ainda</h4>
                  </div>
                ) : (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                          <th className="px-6 py-4">Produto</th>
                          <th className="px-6 py-4 text-center">Hora</th>
                          <th className="px-6 py-4 text-center">Qtd</th>
                          <th className="px-6 py-4 text-right">Lucro</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {sales.map((sale) => (
                          <tr key={sale.id} className="hover:bg-slate-850">
                            <td className="px-6 py-4 font-semibold">{sale.name}</td>
                            <td className="px-6 py-4 text-center">{sale.date}</td>
                            <td className="px-6 py-4 text-center">{sale.qty}</td>
                            <td className="px-6 py-4 text-right text-emerald-400 font-bold">+ R$ {(sale.netProfit * sale.qty).toFixed(2)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </main>

          {}
          <div className="md:hidden fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-800 z-50 px-4 py-3 flex justify-around">
             <button onClick={() => setActiveTab('dashboard')} className={`p-2 rounded flex flex-col items-center ${activeTab === 'dashboard' ? 'text-amber-400' : 'text-slate-400'}`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" /></svg>
              </button>
              <button onClick={() => setActiveTab('stock')} className={`p-2 rounded flex flex-col items-center ${activeTab === 'stock' ? 'text-amber-400' : 'text-slate-400'}`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 11m8 4V4" /></svg>
              </button>
              <button onClick={() => setActiveTab('calculator')} className={`p-2 rounded flex flex-col items-center ${activeTab === 'calculator' ? 'text-amber-400' : 'text-slate-400'}`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
              </button>
              <button onClick={() => setActiveTab('history')} className={`p-2 rounded flex flex-col items-center ${activeTab === 'history' ? 'text-amber-400' : 'text-slate-400'}`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
              </button>
          </div>

          {}
          {selectedSaleProduct && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6">
                <h4 className="text-lg font-bold text-slate-100 mb-4">Simular Saída</h4>
                <div className="space-y-4">
                  <input type="number" value={salePriceInput} onChange={(e) => setSalePriceInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-slate-100" placeholder="Preço" />
                  <select value={saleQtyInput} onChange={(e) => setSaleQtyInput(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-slate-100">
                    {[...Array(selectedSaleProduct.stock).keys()].map(num => <option key={num+1} value={num+1}>{num+1} un</option>)}
                  </select>
                  <div className="flex gap-3 mt-6">
                    <button onClick={() => setSelectedSaleProduct(null)} className="w-1/2 py-2 bg-slate-800 rounded-xl">Cancelar</button>
                    <button onClick={handleConfirmSale} className="w-1/2 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl">Registar</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showAddModal && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleAddProduct} className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6">
                <h4 className="text-lg font-bold mb-4">Novo Produto</h4>
                <div className="space-y-4">
                  <input type="text" placeholder="Nome" value={newProdName} onChange={e => setNewProdName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3" required />
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" placeholder="Custo" value={newProdCost} onChange={e => setNewProdCost(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3" required />
                    <input type="number" placeholder="Venda" value={newProdSell} onChange={e => setNewProdSell(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3" required />
                  </div>
                  <div className="flex gap-3 mt-6">
                    <button type="button" onClick={() => setShowAddModal(false)} className="w-1/2 py-2 bg-slate-800 rounded-xl">Cancelar</button>
                    <button type="submit" className="w-1/2 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Adicionar</button>
                  </div>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker ativado!', reg.scope))
          .catch(err => console.log('Falha no PWA:', err));
      });
    }
  </script>
</body>
</html>
